[project]
name = "cabosueltos"
version = "0.1.0"
description = "Cabos Sueltos backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary,pool]",
    "pydantic-settings",
    "typer",
]

[project.scripts]
cabosueltos = "cabosueltos.cli:app"
cabosueltos-api = "cabosueltos.api.app:run"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "httpx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cabosueltos"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S608"]

[tool.mypy]
strict = true
files = ["cabosueltos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "supabase_probe: staging-only Supabase Data API probe tests",
]
